services:
  mongo-dev:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo-prod:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-dev:
    build:
      context: ./backend/dev
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo-dev:27017/devdb
    ports:
      - "3001:3001"
    depends_on:
      mongo-dev:
        condition: service_healthy

  backend-prod:
    build:
      context: ./backend/prod
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo-prod:27017/proddb
    ports:
      - "3002:3002"
    depends_on:
      mongo-prod:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
      - backend-prod

volumes:
  mongo_dev_data:
  mongo_prod_data:
